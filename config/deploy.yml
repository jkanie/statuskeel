# Kamal 2 configuration for 1 server. Every value marked CHANGE ME is a placeholder.
# Secrets are never written here: .kamal/secrets reads them from the environment.

# Name of your application. Used to uniquely configure containers.
service: statuskeel

# Name of the container image on your registry. CHANGE ME: your-user/statuskeel
image: your-user/statuskeel

# Deploy to these servers. CHANGE ME: the IP address or host name of your server.
servers:
  web:
    - 203.0.113.10

# Kamal Proxy terminates TLS with a Let's Encrypt certificate for this host.
# CHANGE ME: the public host name of your status page (its DNS must point at the server).
proxy:
  ssl: true
  host: status.example.com

# Where you keep your container images. CHANGE ME: your registry (this example uses ghcr.io).
registry:
  server: ghcr.io
  username: your-user
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - SECRET_KEY_BASE
    - RAILS_INBOUND_EMAIL_PASSWORD
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    # Run the Solid Queue supervisor (checks, e-mails, recurring tasks) inside Puma.
    # When you start using more servers, move jobs to a dedicated "job" role running bin/jobs.
    SOLID_QUEUE_IN_PUMA: true

    # CHANGE ME: the same host name as proxy.host. Used for links in e-mails and host checks.
    APP_HOST: status.example.com
    STATUS_PAGE_TITLE: Example status
    MAIL_FROM: Example status <status@example.com>

    # CHANGE ME: your SMTP server for outgoing e-mail (username and password are secrets above).
    SMTP_ADDRESS: smtp.example.com
    SMTP_PORT: 587

    # Keep checks for this many days (also the length of the uptime bars).
    CHECK_RETENTION_DAYS: 90

    # Leave off on a public server. Turn on only to monitor addresses on your own private network.
    ALLOW_PRIVATE_TARGETS: false

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The 4 SQLite databases (app, cache, queue, cable) and Active Storage files live in this volume.
# Back it up off the server.
volumes:
  - "statuskeel_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64
